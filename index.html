<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d0906" />
    <title>आँगन — A Living Radio</title>
    <style>
      :root {
        --cream: #f7ead5;
        --gold: #d9b26b;
        --dark: rgba(10, 7, 5, 0.78);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        align-items: flex-end; /* Aligns player to the bottom */
        padding-bottom: 50px;
        background: #080605;
        color: var(--cream);
        font-family: Georgia, "Times New Roman", serif;
      }
      button {
        font: inherit;
      }
      .app {
        position: fixed;
        inset: 0;
        background: #080605;
      }
      .scene {
        position: absolute;
        inset: -2%;
        background: center/cover no-repeat;
        transition:
          opacity 1s ease,
          transform 12s ease;
        transform: scale(1.025);
      }
      .scene:after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.18),
          rgba(0, 0, 0, 0.06) 40%,
          rgba(0, 0, 0, 0.65)
        );
      }
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 50% 45%,
          transparent 35%,
          rgba(0, 0, 0, 0.45) 100%
        );
        pointer-events: none;
      }
      .rain {
        position: absolute;
        inset: 0;
        opacity: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          105deg,
          transparent 0 18px,
          rgba(220, 235, 255, 0.13) 19px,
          transparent 20px 34px
        );
        mix-blend-mode: screen;
        z-index: 2;
      }
      .rain.on {
        opacity: 1;
        animation: rain 0.65s linear infinite;
      }
      @keyframes rain {
        to {
          background-position: 0 65px;
        }
      }
      header {
        position: absolute;
        z-index: 5;
        top: 25px;
        left: 28px;
        right: 28px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .brand {
        font:
          11px Arial,
          sans-serif;
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }
      .clock {
        text-align: right;
        font:
          10px Arial,
          sans-serif;
        letter-spacing: 0.12em;
        opacity: 0.78;
      }
      .hero {
        position: absolute;
        z-index: 4;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 24px;
      }
      .hero-inner {
        max-width: 780px;
      }
      .eyebrow {
        font:
          10px Arial,
          sans-serif;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        opacity: 0.75;
        margin-bottom: 15px;
      }
      .title {
        margin: 0;
        font-size: clamp(60px, 11vw, 125px);
        font-weight: 500;
        letter-spacing: -0.065em;
        line-height: 0.8;
        text-shadow: 0 10px 40px #000;
      }
      .desc {
        max-width: 570px;
        margin: 22px auto 0;
        font-size: clamp(14px, 2vw, 20px);
        line-height: 1.55;
        text-shadow: 0 3px 20px #000;
      }
      .radio {
        position: absolute;
        z-index: 10;
        left: 50%;
        bottom: max(18px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        width: min(720px, calc(100vw - 32px));
      }

      /* Aangan glass radio — deliberately transparent so the courtyard remains visible. */
      .player {
        position: relative;
        width: 100%;
        padding: 12px 14px 11px;
        border-radius: 28px;
        border: 1px solid rgba(255, 235, 205, 0.20);
        background:
          linear-gradient(135deg, rgba(20, 13, 8, 0.48), rgba(20, 13, 8, 0.22)),
          rgba(255, 255, 255, 0.045);
        box-shadow:
          0 18px 55px rgba(0, 0, 0, 0.42),
          inset 0 1px 0 rgba(255, 255, 255, 0.10);
        backdrop-filter: blur(16px) saturate(120%);
        -webkit-backdrop-filter: blur(16px) saturate(120%);
        color: var(--cream);
        overflow: hidden;
      }

      .player::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 14% 0%, rgba(255, 224, 169, 0.12), transparent 30%),
          linear-gradient(90deg, transparent, rgba(255,255,255,0.025), transparent);
      }

      .row {
        position: relative;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .disc {
        position: relative;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        flex: none;
        overflow: hidden;
        border: 1px solid rgba(255, 236, 203, 0.24);
        background: center/cover no-repeat, #20160e;
        box-shadow:
          0 5px 18px rgba(0,0,0,.28),
          inset 0 0 0 3px rgba(0,0,0,.28);
        color: #f3d69c;
        font-size: 17px;
        transition: transform .35s ease, box-shadow .35s ease;
      }

      .disc::after {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: rgba(12, 8, 5, .88);
        border: 2px solid rgba(244, 214, 158, .65);
        box-shadow: 0 0 0 3px rgba(255,255,255,.08);
      }

      .player.is-playing .disc {
        animation: aanganDiscSpin 7s linear infinite;
        box-shadow:
          0 5px 22px rgba(0,0,0,.36),
          0 0 0 1px rgba(217,178,107,.28),
          inset 0 0 0 3px rgba(0,0,0,.28);
      }

      @keyframes aanganDiscSpin {
        to { transform: rotate(360deg); }
      }

      .meta {
        min-width: 0;
        flex: 1;
        text-align: left;
      }

      .track {
        font-size: 14px;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .artist {
        font: 10px Arial, sans-serif;
        color: rgba(247,234,213,.62);
        margin-top: 5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 3px;
        flex: none;
      }

      .ctrl {
        width: 35px;
        height: 35px;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: rgba(247,234,213,.88);
        cursor: pointer;
        display: grid;
        place-items: center;
        font: 19px/1 Arial, sans-serif;
        transition: transform .18s ease, background .18s ease, color .18s ease;
      }

      .ctrl:hover,
      .ctrl:focus-visible {
        background: rgba(255,255,255,.09);
        color: #fff;
        transform: translateY(-1px);
        outline: none;
      }

      .play {
        width: 43px;
        height: 43px;
        background: linear-gradient(145deg, #e5c17c, #c89d55);
        color: #24170b;
        font-size: 15px;
        box-shadow:
          0 5px 16px rgba(0,0,0,.25),
          inset 0 1px 0 rgba(255,255,255,.35);
      }

      .play:hover,
      .play:focus-visible {
        background: linear-gradient(145deg, #efd18f, #d4aa62);
        color: #24170b;
        transform: scale(1.04);
      }

      .volume-wrap {
        position: relative;
        display: flex;
        align-items: center;
      }

      .volume-panel {
        position: absolute;
        right: 0;
        bottom: 45px;
        width: 125px;
        padding: 10px 11px;
        border-radius: 16px;
        border: 1px solid rgba(255,235,205,.16);
        background: rgba(12,8,5,.72);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        box-shadow: 0 12px 35px rgba(0,0,0,.38);
        display: none;
      }

      .volume-panel.open {
        display: block;
      }

      .volume-panel input {
        width: 100%;
        accent-color: var(--gold);
        cursor: pointer;
      }

      .volume-label {
        display: flex;
        justify-content: space-between;
        margin-bottom: 5px;
        color: rgba(247,234,213,.62);
        font: 8px Arial, sans-serif;
        letter-spacing: .08em;
        text-transform: uppercase;
      }

      .seek-row {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 9px;
      }

      .time {
        width: 31px;
        flex: none;
        color: rgba(247,234,213,.48);
        font: 8px Arial, sans-serif;
        font-variant-numeric: tabular-nums;
      }

      .time:last-child {
        text-align: right;
      }

      .progress {
        position: relative;
        height: 5px;
        flex: 1;
        margin: 0;
        border-radius: 999px;
        background: rgba(255,255,255,.12);
        overflow: visible;
        cursor: pointer;
      }

      .progress::before {
        content: "";
        position: absolute;
        inset: -5px 0;
      }

      .progress i {
        position: relative;
        display: block;
        height: 100%;
        width: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, #b78d4c, #e8c985);
        box-shadow: 0 0 10px rgba(217,178,107,.32);
      }

      .progress i::after {
        content: "";
        position: absolute;
        right: -4px;
        top: 50%;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #f0d18d;
        box-shadow: 0 1px 5px rgba(0,0,0,.45);
        transform: translateY(-50%);
        opacity: .95;
      }

      .status {
        display: none;
      }

      .queue {
        display: none;
        position: absolute;
        bottom: calc(100% + 9px);
        left: 0;
        right: 0;
        max-height: min(360px, 55vh);
        overflow: auto;
        background: rgba(10, 7, 5, 0.97);
        border: 1px solid #ead5af1f;
        border-radius: 15px;
        padding: 7px;
        box-shadow: 0 20px 80px #000b;
      }
      .queue.open {
        display: block;
      }
      .qhead {
        padding: 9px 10px 11px;
        font:
          9px Arial,
          sans-serif;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #c6a16a;
      }
      .qitem {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--cream);
        text-align: left;
        cursor: pointer;
      }
      .qitem:hover,
      .qitem.active {
        background: #d9b26b10;
      }
      .num {
        width: 22px;
        color: #756958;
        font: 9px Arial;
      }
      .qtext {
        flex: 1;
        min-width: 0;
      }
      .qtitle {
        font:
          11px Arial,
          sans-serif;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .qsub {
        font:
          9px Arial,
          sans-serif;
        color: #756b5d;
        margin-top: 2px;
      }
      .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--gold);
        opacity: 0;
      }
      .active .dot {
        opacity: 1;
      }
      .footer {
        position: absolute;
        z-index: 5;
        left: 28px;
        bottom: 30px;
        font:
          9px Arial,
          sans-serif;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #eee0cb88;
      }
      #yt {
        position: fixed;
        width: 200px;
        height: 200px;
        right: 12px;
        top: 12px;
        z-index: 1;
        border-radius: 12px;
        overflow: hidden;
        opacity: 0.01;
        pointer-events: none;
      }
      #yt iframe {
        width: 200px !important;
        height: 200px !important;
      }
      @media (max-width: 600px) {
        header {
          top: 17px;
          left: 17px;
          right: 17px;
        }
        .footer {
          left: 17px;
          bottom: 100px;
        }
        .title {
          font-size: 70px;
        }
        .desc {
          font-size: 14px;
        }
        .radio {
          width: calc(100vw - 14px);
          bottom: max(7px, env(safe-area-inset-bottom));
        }
        .player {
          padding: 11px;
        }
        .disc {
          width: 38px;
          height: 38px;
        }
        .ctrl {
          width: 30px;
          height: 30px;
        }
        .play {
          width: 38px;
          height: 38px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .scene,
        .rain {
          transition: none;
          animation: none;
        }
      }
      @media (max-width: 767px) {
        .radio {
          width: calc(100vw - 18px);
          bottom: calc(8px + var(--safe-bottom));
        }

        .player {
          padding: 9px 10px 8px;
          border-radius: 22px;
          background:
            linear-gradient(135deg, rgba(18, 12, 8, .46), rgba(18, 12, 8, .22)),
            rgba(255,255,255,.045);
          backdrop-filter: blur(18px) saturate(125%);
          -webkit-backdrop-filter: blur(18px) saturate(125%);
        }

        .disc {
          width: 38px;
          height: 38px;
          font-size: 14px;
        }

        .ctrl {
          width: 32px;
          height: 32px;
          font-size: 17px;
        }

        .play {
          width: 39px;
          height: 39px;
        }

        .track {
          font-size: 12px;
        }

        .artist {
          font-size: 8px;
          margin-top: 3px;
        }

        .seek-row {
          margin-top: 7px;
          gap: 6px;
        }

        .progress {
          height: 4px;
        }

        .time {
          width: 28px;
          font-size: 7px;
        }

        .volume-panel {
          bottom: 41px;
          width: 112px;
        }
      }

      @media (max-width: 390px) {
        .radio {
          width: calc(100vw - 12px);
        }

        .disc {
          display: none;
        }

        .volume-wrap {
          display: none;
        }

        .ctrl {
          width: 31px;
          height: 31px;
        }

        .play {
          width: 37px;
          height: 37px;
        }

        .track {
          font-size: 11px;
        }
      }

    </style>

    <style id="aangan-responsive">
      /* ===== AANGAN MOBILE-FIRST RESPONSIVE SYSTEM ===== */
      :root {
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-top: env(safe-area-inset-top, 0px);
      }

      html {
        width: 100%;
        min-width: 0;
        min-height: 100%;
        overflow: hidden;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        width: 100%;
        min-width: 0;
        min-height: 100svh;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: manipulation;
      }
      .app {
        width: 100%;
        min-width: 0;
        height: 100svh;
        min-height: 100svh;
        overflow: hidden;
      }
      .scene,
      .vignette,
      .rain {
        width: 100%;
        height: 100%;
      }
      .scene {
        inset: 0;
        transform: scale(1.01);
        background-size: cover;
        background-position: center center;
      }

      /* Large phones / foldables */
      @media (max-width: 767px) {
        header {
          top: calc(14px + var(--safe-top));
          left: 16px;
          right: 16px;
          align-items: center;
        }
        .brand {
          font-size: 9px;
          letter-spacing: 0.22em;
        }
        .clock {
          max-width: 48vw;
          font-size: 8px;
          line-height: 1.35;
          letter-spacing: 0.06em;
        }

        .hero {
          padding: calc(76px + var(--safe-top)) 18px
            calc(128px + var(--safe-bottom));
          align-items: center;
        }
        .hero-inner {
          width: min(100%, 680px);
        }
        .eyebrow {
          margin-bottom: 12px;
          font-size: 8px;
          letter-spacing: 0.27em;
          line-height: 1.5;
        }
        .title {
          font-size: clamp(48px, 18vw, 92px) !important;
          line-height: 0.88 !important;
          letter-spacing: -0.055em;
          overflow-wrap: anywhere;
        }
        .desc {
          width: min(100%, 500px);
          margin: 16px auto 0;
          padding: 0 4px;
          font-size: clamp(13px, 3.8vw, 17px) !important;
          line-height: 1.45;
        }

        .footer {
          left: 16px;
          right: 16px;
          bottom: calc(112px + var(--safe-bottom));
          text-align: center;
          font-size: 7px;
          letter-spacing: 0.09em;
        }

        .radio {
          left: 8px;
          right: 8px;
          bottom: calc(7px + var(--safe-bottom));
          width: auto;
          max-width: none;
          transform: none;
        }
        .player {
          width: 100% !important;
          max-width: none !important;
          padding: 9px 10px;
          border-radius: 15px;
        }
        .row {
          gap: 7px;
          min-width: 0;
        }
        .disc {
          width: 34px;
          height: 34px;
          border-radius: 9px;
          font-size: 16px;
        }
        .meta {
          min-width: 0;
          width: 0;
        }
        .track {
          font-size: 12px;
        }
        .artist {
          font-size: 8px;
          margin-top: 3px;
        }
        .controls {
          flex: none;
          gap: 1px;
        }
        .ctrl {
          width: 34px;
          height: 34px;
          min-width: 34px;
          min-height: 34px;
          padding: 0;
        }
        .play {
          width: 38px;
          height: 38px;
          min-width: 38px;
          min-height: 38px;
        }
        .progress {
          margin-top: 8px;
        }
        .status {
          margin-top: 5px;
          font-size: 8px;
        }

        .queue {
          left: 0;
          right: 0;
          bottom: calc(100% + 7px);
          max-height: min(55svh, 430px);
          border-radius: 14px;
          padding: 5px;
        }
        .qhead {
          padding: 8px;
          font-size: 8px;
        }
        .qitem {
          min-height: 42px;
          padding: 8px;
        }
        .qtitle {
          font-size: 10px;
        }
        .qsub {
          font-size: 8px;
        }
      }

      /* Narrow phones: 320–390px and similar OEM widths */
      @media (max-width: 390px) {
        header {
          top: calc(11px + var(--safe-top));
          left: 12px;
          right: 12px;
        }
        .brand {
          font-size: 8px;
          letter-spacing: 0.18em;
        }
        .clock {
          font-size: 7px;
          max-width: 52vw;
        }

        .hero {
          padding-left: 12px;
          padding-right: 12px;
          padding-bottom: calc(125px + var(--safe-bottom));
        }
        .title {
          font-size: clamp(43px, 19vw, 76px) !important;
        }
        .eyebrow {
          font-size: 7px;
          letter-spacing: 0.22em;
        }
        .desc {
          font-size: 12px !important;
          max-width: 310px;
        }

        .radio {
          left: 6px;
          right: 6px;
          bottom: calc(5px + var(--safe-bottom));
        }
        .player {
          padding: 8px;
          border-radius: 13px;
        }
        .disc {
          display: none;
        }
        .controls {
          gap: 0;
        }
        .ctrl {
          width: 32px;
          height: 32px;
          min-width: 32px;
          min-height: 32px;
        }
        .play {
          width: 36px;
          height: 36px;
          min-width: 36px;
          min-height: 36px;
        }
        .track {
          font-size: 11px;
        }
        .artist {
          font-size: 7px;
        }
        .status {
          font-size: 7px;
        }
        .footer {
          bottom: calc(108px + var(--safe-bottom));
          font-size: 6.5px;
        }
      }

      /* Very narrow / short devices */
      @media (max-width: 340px), (max-height: 620px) and (max-width: 767px) {
        .hero {
          padding-top: calc(60px + var(--safe-top));
          padding-bottom: calc(112px + var(--safe-bottom));
        }
        .title {
          font-size: clamp(38px, 17vw, 62px) !important;
        }
        .desc {
          margin-top: 10px;
          font-size: 11px !important;
        }
        .eyebrow {
          margin-bottom: 7px;
        }
        .footer {
          display: none;
        }
        .player {
          padding: 7px;
        }
        .status {
          display: none;
        }
        .progress {
          margin-top: 6px;
        }
      }

      /* Short but wide phones in landscape */
      @media (orientation: landscape) and (max-height: 600px) and (max-width: 1024px) {
        .hero {
          padding: calc(45px + var(--safe-top)) 18px
            calc(82px + var(--safe-bottom));
        }
        .title {
          font-size: clamp(42px, 11vh, 76px) !important;
        }
        .desc {
          margin-top: 8px;
          font-size: 12px !important;
          max-width: 560px;
        }
        .eyebrow {
          margin-bottom: 6px;
        }
        .footer {
          display: none;
        }
        .radio {
          left: 12px;
          right: 12px;
          bottom: calc(6px + var(--safe-bottom));
        }
        .player {
          max-width: 620px !important;
          margin: auto;
        }
        .queue {
          max-height: 72svh;
        }
      }

      /* Tablets / iPad / Android tablets */
      @media (min-width: 768px) and (max-width: 1200px) {
        .hero {
          padding: 30px;
        }
        .title {
          font-size: clamp(72px, 12vw, 116px) !important;
        }
        .desc {
          max-width: 620px;
        }
        .radio {
          width: min(680px, calc(100vw - 40px));
          bottom: calc(14px + var(--safe-bottom));
        }
        .player {
          padding: 13px 15px;
        }
      }

      /* Desktop */
      @media (min-width: 1201px) {
        .scene {
          transform: scale(1.025);

      const fallbackSongs = [

      ];
      let player = null,

      const setStyle = (id, prop, value) => {

      function getSlot() {
        let h = new Date().getHours();

        return slots.findIndex((s) => h >= s.from && h < s.to);

      function queueForSlot(n) {
        return (
          [
            "sunrise",
            "morning",
            "afternoon",
            "late",
            "sunset",
            "night",
            "midnight",
            "lateNight",
          ][n] || "sunrise"
        );

      function applySlot() {
        let n = getSlot();
        if (n < 0) return;
        if (n !== currentSlot) {
          currentSlot = n;
          const s = slots[n];
          setStyle("scene", "backgroundImage", `url("${IMAGES[s.img]}")`);
          setText("slot", s.name);
          setText("desc", s.desc);
          setText("qhead", "आँगन Radio · " + s.name);
          activeQueue = queueForSlot(n);
          activeVideoIndex = 0;
          renderQueue();
          if (ready && !playing) loadActive(false);

      function updateClock() {
        const d = new Date();
        setText(
          "clock",
          d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) +
            " · " +
            Intl.DateTimeFormat().resolvedOptions().timeZone,
        );
        applySlot();

        const list = $("songs");

          `<button class="qitem ${i === activeVideoIndex ? "active" : ""}" data-i="${i}">

              <span class="qsub">${song.artist}</span>
            </span>
            <span class="dot"></span>
          </button>`
        ).join("");

        list.querySelectorAll(".qitem").forEach((b) =>
          b.addEventListener("click", () => {
            activeVideoIndex = Number(b.dataset.i);
            loadControlledSong(true);
            $("queue").classList.remove("open");
          })
        );
      }


      function setMeta(title, sub) {
        $("track").textContent = title || "आँगन Radio";
        $("artist").textContent = sub || "90s Hindi Radio";
        renderQueue();
        const song = AANGAN_TEST_SONGS[activeVideoIndex];
        if (song) {
          $("disc").style.backgroundImage =
            `url("https://i.ytimg.com/vi/${song.id}/hqdefault.jpg")`;
        }
      }
      function loadActive(play) {
        if (!ready) return;
        const q = VIDEO_QUEUES[activeQueue] || VIDEO_QUEUES.sunrise;
        const item = q[activeVideoIndex % q.length];
        $("status").textContent = "Loading · " + item.title;
        player.loadVideoById({ videoId: item.id, startSeconds: 0 });
        if (!play) {
          player.pauseVideo();
        }
      }
      function cueAt(index) {
        activeVideoIndex = Math.max(0, index);
        loadActive(true);
      }
      function toggle() {
        if (!ready) {
          $("status").textContent = "Connecting to YouTube…";
          return;

        playing ? player.pauseVideo() : player.playVideo();
      }
      $("play").onclick = () => {
        if (!ready || !player) return;
        const state = player.getPlayerState ? player.getPlayerState() : -1;
        if (state === YT.PlayerState.PLAYING || state === YT.PlayerState.BUFFERING) {
          player.pauseVideo();
        } else {
          player.playVideo();
        }
      };


      $("next").onclick = () => goToSong(activeVideoIndex + 1);
      $("prev").onclick = () => goToSong(activeVideoIndex - 1);

        renderQueue();
        e.stopPropagation();

      document.addEventListener("click", (e) => {
        if (!$("queue").contains(e.target) && e.target !== $("more"))
          $("queue").classList.remove("open");
      });

        if (e.key === "Escape") $("queue").classList.remove("open");
        if (e.code === "Space" && document.activeElement.tagName !== "INPUT") {
          e.preventDefault();
          toggle();
        }
      });
      function formatTime(seconds) {
        if (!Number.isFinite(seconds) || seconds < 0) return "0:00";
        const s = Math.floor(seconds);
        const m = Math.floor(s / 60);
        return `${m}:${String(s % 60).padStart(2, "0")}`;
      }

      function updatePlayerVisualState() {
        const card = $("playerCard");
        if (card) card.classList.toggle("is-playing", playing);
      }

      $("progress").addEventListener("click", (e) => {
        if (!player || !ready) return;
        const rect = e.currentTarget.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        const duration = player.getDuration();
        if (duration) player.seekTo(duration * ratio, true);
      });

      $("progress").addEventListener("keydown", (e) => {
        if (!player || !ready) return;
        if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
        e.preventDefault();
        const duration = player.getDuration();
        const current = player.getCurrentTime();
        const step = 10;
        player.seekTo(Math.max(0, Math.min(duration, current + (e.key === "ArrowRight" ? step : -step))), true);
      });

      document.addEventListener("click", (e) => {
        if (!$("volumePanel").contains(e.target) && e.target !== $("volume"))
          $("volumePanel").classList.remove("open");

      function updateProgress() {
        if (!player || !ready) return;
        try {
          const d = player.getDuration();
          const t = player.getCurrentTime();
          const percent = d ? Math.min(100, (t / d) * 100) : 0;

          setStyle("bar", "width", percent + "%");
          setText("currentTime", formatTime(t));
          setText("duration", formatTime(d));

          const seek = $("progress");
          if (seek) seek.setAttribute("aria-valuenow", Math.round(percent));
        } catch (e) {}

      window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;
      function onYouTubeIframeAPIReady() {
        // YouTube's API can reject an invalid "null" origin when the page
        // is opened directly from file://. Only send origin for real web origins.
        const protocol = window.location.protocol;
        const validOrigin =
          protocol === "http:" || protocol === "https:"
            ? window.location.origin
            : null;

        player = new YT.Player("yt", {
          width: "200",
          height: "200",

        setMeta(song.title, song.artist);

            } catch (e) {
              console.warn("Weather unavailable", e);
            }
          },
          (err) => {
            console.warn("Geolocation unavailable", err.message);
          },
          { enableHighAccuracy: false, timeout: 8000, maximumAge: 600000 },
        );
